schema_version: 1
name: cse-initial-conversion-trials
description: |
  CPU-only Spack 1.2 workspace initialized from an explicit static platform
  catalog. It renders self-contained Core, Common, Serial, and MPI environments
  for both the CSE GCC and platform compiler surfaces.
template_root: templates
snapshot_catalog: true
required_values:
  - workspace.role
  - build.node_type
  - architecture.target
  - architecture.binary_target
  - architecture.node_types
  - system.name
  - release
  - stack.name
  - shared.compiler.name
  - shared.compiler.version
  - shared.compiler.public_name
  - shared.compiler.source
  - shared.compiler.modules
  - shared.compiler.build_with.name
  - shared.compiler.build_with.version
  - shared.catalog_scopes.compiler
  - shared.mpi.name
  - shared.mpi.version
  - shared.mpi.source
  - shared.mpi.modules
  - shared.mpi.spec
  - shared.mpi.provider_constraint
  - platform.compiler.name
  - platform.compiler.version
  - platform.compiler.public_name
  - platform.compiler.source
  - platform.compiler.modules
  - platform.catalog_scopes.compiler
  - platform.mpi.name
  - platform.mpi.version
  - platform.mpi.source
  - platform.mpi.modules
  - platform.mpi.spec
  - platform.mpi.provider_constraint
  - catalog_scopes.common
  - paths.install_tree
  - paths.build_stage
  - paths.source_cache
  - paths.misc_cache
  - paths.views_root
  - paths.modules_root
  - buildcache.name
  - buildcache.url
  - permissions.group
  - permissions.read
  - permissions.write
  - build_jobs
  - spack.source
  - spack.version
  - spack.tag
  - spack.commit
  - spack.default_mode
  - spack.shared_root
  - spack.initial_root
  - package_repo.git
  - package_repo.tag
data_files:
  roster: roster.yaml
allowed_values:
  workspace.role: [build, publish]
  shared.compiler.source: [build]
  shared.mpi.source: [external, build]
  platform.compiler.source: [external]
  platform.mpi.source: [external, build]
  spack.default_mode: [shared, local]
catalog_scope_values:
  - catalog_scopes.common
  - catalog_scopes.platform
  - shared.catalog_scopes.compiler
  - shared.catalog_scopes.mpi
  - platform.catalog_scopes.compiler
  - platform.catalog_scopes.runtime_compiler
  - platform.catalog_scopes.mpi
