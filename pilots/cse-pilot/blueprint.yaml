schema_version: 1
name: cse-initial-conversion-trials
description: |
  CPU-only Spack 1.2 workspace initialized from an explicit static platform
  catalog. It renders one GCC bootstrap environment, one shared GCC Core
  environment, and Common, Serial, and MPI environments for both the CSE GCC
  and platform compiler surfaces.
template_root: templates
required_values:
  - workspace.role
  - system.name
  - release
  - stack.name
  - shared.compiler.name
  - shared.compiler.version
  - shared.compiler.toolchain
  - shared.compiler.public_name
  - shared.compiler.source
  - shared.compiler.modules
  - shared.mpi.name
  - shared.mpi.version
  - shared.mpi.toolchain
  - shared.mpi.source
  - shared.mpi.modules
  - platform.compiler.name
  - platform.compiler.version
  - platform.compiler.toolchain
  - platform.compiler.public_name
  - platform.compiler.source
  - platform.compiler.modules
  - platform.catalog_scopes.compiler
  - platform.mpi.name
  - platform.mpi.version
  - platform.mpi.toolchain
  - platform.mpi.source
  - platform.mpi.modules
  - catalog_scopes.common
  - paths.install_tree
  - paths.build_stage
  - paths.source_cache
  - paths.misc_cache
  - paths.views_root
  - paths.modules_root
  - buildcache.name
  - buildcache.url
  - permissions.group
  - permissions.read
  - permissions.write
  - build_jobs
  - package_repo.git
  - package_repo.tag
data_files:
  roster: roster.yaml
allowed_values:
  workspace.role: [build, publish]
  shared.compiler.source: [build]
  shared.mpi.source: [external, build]
  platform.compiler.source: [external]
  platform.mpi.source: [external, build]
catalog_scope_values:
  - catalog_scopes.common
  - catalog_scopes.platform
  - shared.catalog_scopes.compiler
  - shared.catalog_scopes.mpi
  - platform.catalog_scopes.compiler
  - platform.catalog_scopes.mpi
