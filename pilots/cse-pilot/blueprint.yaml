schema_version: 1
name: cse-initial-conversion-trials
description: |
  CPU-only Spack 1.2 workspace initialized from an explicit static platform
  catalog. It renders self-contained Core, Common, Serial, and MPI environments
  for both the CSE GCC and platform compiler surfaces.
template_root: templates
snapshot_catalog: true
apply_workspace_permissions: true
control_files:
  - cse-build
  - configs/common/config.yaml
  - env/prepare-module-state.sh
  - env/share-generated-permissions.sh
  - scripts/workspace-permissions.py
  - scripts/verify-overlay-inputs.py
  - scripts/verify-workspace-inputs.py
  - env/select-build-context.sh
  - env/setup-build-env.sh
  - env/workspace-shell.rc
  - scripts/verify-lockfiles.py
  - scripts/overlay-recovery.py
  - scripts/workspace-overlay.py
  - scripts/workspace-build.py
  - scripts/module-preview.py
  - BUILDER-HANDOFF.md
  - PACKAGE-OVERLAY-QUICKSTART.md
control_file_dependencies:
  cse-build:
    - env/setup-build-env.sh
    - env/select-build-context.sh
    - env/prepare-module-state.sh
    - scripts/verify-lockfiles.py
    - scripts/verify-workspace-inputs.py
    - env/share-generated-permissions.sh
    - env/workspace-shell.rc
    - scripts/workspace-permissions.py
    - scripts/verify-overlay-inputs.py
    - package-repos/overlay-inventory.json
    - scripts/overlay-recovery.py
    - scripts/workspace-overlay.py
    - scripts/workspace-build.py
    - scripts/module-preview.py
  env/share-generated-permissions.sh:
    - scripts/workspace-permissions.py
  env/workspace-shell.rc:
    - env/share-generated-permissions.sh
    - scripts/workspace-permissions.py
  scripts/workspace-overlay.py:
    - scripts/workspace-build.py
    - scripts/overlay-recovery.py
    - scripts/verify-overlay-inputs.py
  scripts/workspace-build.py:
    - scripts/workspace-overlay.py
    - scripts/overlay-recovery.py
    - scripts/verify-overlay-inputs.py
  scripts/overlay-recovery.py:
    - scripts/verify-overlay-inputs.py
  scripts/module-preview.py:
    - scripts/workspace-build.py
  scripts/verify-workspace-inputs.py:
    - scripts/verify-overlay-inputs.py
    - scripts/verify-lockfiles.py
    - package-repos/overlay-inventory.json
  env/setup-build-env.sh:
    - scripts/verify-overlay-inputs.py
    - package-repos/overlay-inventory.json
  scripts/verify-lockfiles.py:
    - scripts/verify-overlay-inputs.py
    - package-repos/overlay-inventory.json
control_trees:
  # Presentation-only controls. Package modulefiles are generated directly
  # below values.paths.modules_root and are never part of this workspace tree.
  - modulefiles
  - presentation
required_values:
  - workspace.role
  - build.contexts.login.node_type
  - build.contexts.login.stages
  - build.contexts.compute.node_type
  - build.contexts.compute.stages
  - architecture.target
  - architecture.binary_target
  - architecture.node_types
  - system.name
  - release
  - stack.name
  - shared.compiler.name
  - shared.compiler.version
  - shared.compiler.public_name
  - shared.compiler.source
  - shared.compiler.modules
  - shared.compiler.commands.c
  - shared.compiler.commands.cxx
  - shared.compiler.commands.fortran
  - shared.compiler.build_with.name
  - shared.compiler.build_with.version
  - shared.compiler.build_with.modules
  - shared.catalog_scopes.compiler
  - shared.mpi.name
  - shared.mpi.version
  - shared.mpi.source
  - shared.mpi.modules
  - shared.mpi.commands.c
  - shared.mpi.commands.cxx
  - shared.mpi.commands.fortran
  - shared.mpi.spec
  - shared.mpi.provider_constraint
  - platform.compiler.name
  - platform.compiler.version
  - platform.compiler.public_name
  - platform.compiler.source
  - platform.compiler.modules
  - platform.compiler.commands.c
  - platform.compiler.commands.cxx
  - platform.compiler.commands.fortran
  - platform.catalog_scopes.compiler
  - platform.mpi.name
  - platform.mpi.version
  - platform.mpi.source
  - platform.mpi.modules
  - platform.mpi.commands.c
  - platform.mpi.commands.cxx
  - platform.mpi.commands.fortran
  - platform.mpi.spec
  - platform.mpi.provider_constraint
  - catalog_scopes.common
  - paths.install_tree
  - paths.source_cache
  - paths.misc_cache
  - paths.views_root
  - paths.modules_root
  - buildcache.name
  - buildcache.url
  - permissions.group
  - permissions.read
  - permissions.write
  - build_jobs
  - spack.source
  - spack.version
  - spack.tag
  - spack.commit
  - spack.default_mode
  - spack.shared_root
  - spack.initial_root
  - package_repo.git
  - package_repo.tag
  - package_repo.commit
data_files:
  roster: roster.yaml
allowed_values:
  workspace.role: [build, publish]
  permissions.read: [group, world]
  permissions.write: [user, group]
  shared.compiler.source: [build]
  shared.mpi.source: [external, build]
  platform.compiler.source: [external]
  platform.mpi.source: [external, build]
  spack.default_mode: [shared, local]
catalog_scope_values:
  - catalog_scopes.common
  - catalog_scopes.platform
  - shared.catalog_scopes.compiler
  - shared.catalog_scopes.mpi
  - platform.catalog_scopes.compiler
  - platform.catalog_scopes.runtime_compiler
  - platform.catalog_scopes.mpi
