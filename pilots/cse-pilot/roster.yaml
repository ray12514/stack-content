schema_version: 1
name: cse-pilot-roster
description: The two-version CSE pilot roster, split by exposure surface.

specs:
  foundation:
    - zlib@1.3.1
    - xz@5.4.6
    - zstd@1.5.6
  core:
    - cmake@4.3.3
    - cmake@4.2.3
    - ninja
    - pkgconf
    - git
    - python@3.14.5
    - python@3.13.13
    - py-numpy@2.4.6 ^python@3.14.5
    - py-numpy@2.4.6 ^python@3.13.13
    - miniforge3@26.1.1-3
    - gsl@2.8
    - gsl@2.7.1
    - sqlite@3.53.1
    - sqlite@3.51.2
  common:
    - openblas@0.3.33
    - openblas@0.3.32
    - gnuplot@6.0.0
    - gnuplot@5.4.10
  serial:
    - hdf5@2.1.0 ~mpi +fortran +cxx +hl
    - hdf5@1.14.6 ~mpi +fortran +cxx +hl
    - netcdf-c@4.10.0 ~mpi ^hdf5@2.1.0~mpi
    - netcdf-c@4.9.3 ~mpi ^hdf5@1.14.6~mpi
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0~mpi ^hdf5@2.1.0~mpi
    - netcdf-fortran@4.6.1 ^netcdf-c@4.9.3~mpi ^hdf5@1.14.6~mpi
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0~mpi ^hdf5@2.1.0~mpi
    - fftw@3.3.11 ~mpi
    - fftw@3.3.10 ~mpi
    - boost@1.90.0 ~mpi
    - boost@1.89.0 ~mpi
  mpi:
    - hdf5@2.1.0 +mpi +fortran +cxx +hl
    - hdf5@1.14.6 +mpi +fortran +cxx +hl
    - netcdf-c@4.10.0 +mpi +parallel-netcdf ^hdf5@2.1.0+mpi
    - netcdf-c@4.9.3 +mpi +parallel-netcdf ^hdf5@1.14.6+mpi
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0+mpi ^hdf5@2.1.0+mpi
    - netcdf-fortran@4.6.1 ^netcdf-c@4.9.3+mpi ^hdf5@1.14.6+mpi
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0+mpi ^hdf5@2.1.0+mpi
    - fftw@3.3.11 +mpi
    - fftw@3.3.10 +mpi
    - boost@1.90.0 +mpi
    - boost@1.89.0 +mpi
    - netlib-scalapack@2.2.3
    - netlib-scalapack@2.2.2
    - tau@2.35.1 +mpi
    - dakota@6.24.0 +mpi
    - dakota@6.23.0 +mpi
  gpu_payload:
    - tau@2.35.1 +mpi +gpu_runtime
    - kokkos@5.1.1 +gpu
    - kokkos@5.1.0 +gpu

module_packages:
  core: [cmake, ninja, pkgconf, git, python, py-numpy, miniforge3, gsl, sqlite]
  common: [openblas, gnuplot]
  serial: [hdf5, netcdf-c, netcdf-fortran, netcdf-cxx4, fftw, boost]
  mpi: [hdf5, netcdf-c, netcdf-fortran, netcdf-cxx4, fftw, boost, netlib-scalapack, tau, dakota]
  gpu: [hdf5, netcdf-c, netcdf-fortran, netcdf-cxx4, fftw, boost, netlib-scalapack, tau, dakota, kokkos]
