schema_version: 1
name: cse-initial-conversion-trials-roster
description: Approved CPU-only trial roster with compatibility and current build chains.

cmake:
  build_default: "3.31.12"
  current: "4.4.2"

specs:
  foundation:
    - zlib@1.3.1
    - xz@5.4.6
    - zstd@1.5.6

  build_tools:
    - cmake@3.31.12
    - cmake@4.4.2

  core:
    - cmake@3.31.12
    - cmake@4.4.2
    # Ninja has an unconditional build-only Python dependency. Pin it to the
    # approved current trial Python so it cannot add a fourth interpreter.
    - ninja ^python@3.12.13
    - pkgconf
    - git
    - python@3.8.20
    - python@3.10.20
    - python@3.12.13
    - gsl@2.6
    - gsl@2.8
    - sqlite@3.51.2
    - sqlite@3.53.1

  # Binary distribution with no Spack compiler-language dependency. It remains
  # a Core package, but `%compiler` and `needs: [compiler]` are invalid for it.
  core_independent:
    - miniforge3@26.1.1-3

  common:
    - netlib-lapack@3.10.1 ^cmake@3.31.12
    - netlib-lapack@3.12.1 ^cmake@3.31.12
    - gnuplot@5.4.10
    - gnuplot@6.0.0

  serial:
    - hdf5@1.10.6~mpi+fortran+cxx+hl ^cmake@3.31.12
    - hdf5@2.1.0~mpi+fortran+cxx+hl ^cmake@3.31.12
    - netcdf-c@4.9.2~mpi build_system=cmake ^hdf5@1.10.6~mpi+fortran+cxx+hl ^cmake@3.31.12
    - netcdf-c@4.10.0~mpi build_system=cmake ^hdf5@2.1.0~mpi+fortran+cxx+hl ^cmake@3.31.12
    - netcdf-fortran@4.6.0 ^netcdf-c@4.9.2~mpi build_system=cmake ^hdf5@1.10.6~mpi+fortran+cxx+hl
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0~mpi build_system=cmake ^hdf5@2.1.0~mpi+fortran+cxx+hl
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.9.2~mpi build_system=cmake ^hdf5@1.10.6~mpi+fortran+cxx+hl
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0~mpi build_system=cmake ^hdf5@2.1.0~mpi+fortran+cxx+hl
    - fftw@3.3.10~mpi
    - fftw@3.3.11~mpi
    - boost@1.81.0~mpi
    - boost@1.90.0~mpi

  mpi:
    - hdf5@1.10.6+mpi+fortran+cxx+hl ^cmake@3.31.12
    - hdf5@2.1.0+mpi+fortran+cxx+hl ^cmake@3.31.12
    - netcdf-c@4.9.2+mpi~parallel-netcdf build_system=cmake ^hdf5@1.10.6+mpi+fortran+cxx+hl ^cmake@3.31.12
    - netcdf-c@4.10.0+mpi~parallel-netcdf build_system=cmake ^hdf5@2.1.0+mpi+fortran+cxx+hl ^cmake@3.31.12
    - netcdf-fortran@4.6.0 ^netcdf-c@4.9.2+mpi~parallel-netcdf build_system=cmake ^hdf5@1.10.6+mpi+fortran+cxx+hl
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0+mpi~parallel-netcdf build_system=cmake ^hdf5@2.1.0+mpi+fortran+cxx+hl
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.9.2+mpi~parallel-netcdf build_system=cmake ^hdf5@1.10.6+mpi+fortran+cxx+hl
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0+mpi~parallel-netcdf build_system=cmake ^hdf5@2.1.0+mpi+fortran+cxx+hl
    - fftw@3.3.10+mpi
    - fftw@3.3.11+mpi
    - boost@1.81.0+mpi
    - boost@1.90.0+mpi
    # Dakota defaults to Python and independently requests BLAS, LAPACK,
    # Boost, and MPI. Bind those edges to approved trial producers so its DAG
    # cannot grow parallel Python, LAPACK, or Boost builds.
    - dakota@6.23.0+mpi+python~hdf5~python-direct-interface~python-wrapper~python-surrogates ^python@3.12.13 ^netlib-lapack@3.12.1 ^boost@1.90.0+mpi ^cmake@3.31.12
    - dakota@6.24.0+mpi+python~hdf5~python-direct-interface~python-wrapper~python-surrogates ^python@3.12.13 ^netlib-lapack@3.12.1 ^boost@1.90.0+mpi ^cmake@3.31.12
