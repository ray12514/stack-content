schema_version: 1
name: science-full
tier: canonical
description: |
  Full curated science library set, up to two versions per package:
  HDF5/NetCDF/FFTW/Boost serial+MPI dual builds, OpenBLAS (BLAS+LAPACK),
  ScaLAPACK, Gnuplot, TAU, Dakota, and Kokkos for GPU lanes.

kinds: [common, serial, mpi, gpu]

specs:
  common:
    # compiler-common: built for one compiler family, independent of the
    # execution model, so one build serves Serial, MPI, and GPU alike. Not
    # Core, because both must be built with the surface's compiler.
    # BLAS and LAPACK for every lane: openblas provides both APIs
    # (provides("blas", "lapack")), so it is the single implementation.
    - openblas@0.3.33
    - openblas@0.3.32
    # user tool: needs the surface's compiler for library compatibility
    - gnuplot@6.0.0
    - gnuplot@5.4.10
  serial:
    # serial = MPI-capable packages deliberately built without MPI
    - hdf5@2.1.0 ~mpi +fortran +cxx +hl
    - hdf5@1.14.6 ~mpi +fortran +cxx +hl
    - netcdf-c@4.10.0 ~mpi ^hdf5@2.1.0~mpi
    - netcdf-c@4.9.3 ~mpi ^hdf5@1.14.6~mpi
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0~mpi ^hdf5@2.1.0~mpi
    - netcdf-fortran@4.6.1 ^netcdf-c@4.9.3~mpi ^hdf5@1.14.6~mpi
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0~mpi ^hdf5@2.1.0~mpi
    - fftw@3.3.11 ~mpi
    - fftw@3.3.10 ~mpi
    - boost@1.90.0 ~mpi
    - boost@1.89.0 ~mpi
  mpi:
    - hdf5@2.1.0 +mpi +fortran +cxx +hl
    - hdf5@1.14.6 +mpi +fortran +cxx +hl
    - netcdf-c@4.10.0 +mpi +parallel-netcdf ^hdf5@2.1.0+mpi
    - netcdf-c@4.9.3 +mpi +parallel-netcdf ^hdf5@1.14.6+mpi
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0+mpi ^hdf5@2.1.0+mpi
    - netcdf-fortran@4.6.1 ^netcdf-c@4.9.3+mpi ^hdf5@1.14.6+mpi
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0+mpi ^hdf5@2.1.0+mpi
    - fftw@3.3.11 +mpi
    - fftw@3.3.10 +mpi
    - boost@1.90.0 +mpi
    - boost@1.89.0 +mpi
    # distributed dense linear algebra: MPI by nature (BLACS over MPI), so it
    # has no serial form. Rides the lane's BLAS/LAPACK.
    - netlib-scalapack@2.2.3
    - netlib-scalapack@2.2.2
    # profiler: a tool users run, not a library their code carries, so one
    # version (same rule as miniforge3)
    - tau@2.35.1 +mpi
    - dakota@6.24.0 +mpi
    - dakota@6.23.0 +mpi
  gpu:
    # GPU is a superset of the MPI lane's runtime surface: it selects the
    # same MPI-enabled roster (identical specs -> Spack reuses the installed
    # builds by hash; no rebuild), plus the GPU payload.
    - hdf5@2.1.0 +mpi +fortran +cxx +hl
    - hdf5@1.14.6 +mpi +fortran +cxx +hl
    - netcdf-c@4.10.0 +mpi +parallel-netcdf ^hdf5@2.1.0+mpi
    - netcdf-c@4.9.3 +mpi +parallel-netcdf ^hdf5@1.14.6+mpi
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0+mpi ^hdf5@2.1.0+mpi
    - netcdf-fortran@4.6.1 ^netcdf-c@4.9.3+mpi ^hdf5@1.14.6+mpi
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0+mpi ^hdf5@2.1.0+mpi
    - fftw@3.3.11 +mpi
    - fftw@3.3.10 +mpi
    - boost@1.90.0 +mpi
    - boost@1.89.0 +mpi
    - netlib-scalapack@2.2.3
    - netlib-scalapack@2.2.2
    - dakota@6.24.0 +mpi
    - dakota@6.23.0 +mpi
    # GPU-aware profiler: the plain +mpi tau cannot see kernels, so the GPU
    # lane carries its own build. +gpu_runtime expands to +rocm or +cuda with
    # no arch flag: tau traces the GPU runtime, it does not compile device
    # code, and its recipe has no amdgpu_target/cuda_arch variant.
    - tau@2.35.1 +mpi +gpu_runtime
    # GPU payload: +gpu expands per lane to +rocm amdgpu_target=<arch> or
    # +cuda cuda_arch=<n>
    - kokkos@5.1.1 +gpu
    - kokkos@5.1.0 +gpu

provenance_hints:
  cray-mpich: Platform-backed
  openmpi:    Site-external
  openssl:    Site-external

notes: |
  Roster from the 2026-07 usage list plus tau and kokkos. The common kind is
  the compiler-common group: built once per compiler, independent of the
  execution model, and reachable from the compiler surface rather than from
  any one lane (openblas is node-local dense linear algebra every lane
  links). The gpu kind repeats
  the mpi kind's roster verbatim (2026-07-13): GPU is a superset of the
  MPI lane's runtime surface, and identical specs reuse the same installs
  by hash, so the cost is lockfile entries and modules, not rebuilds.
  openmpi,
  cray-mpich, and openssl are system externals, never built. Versions are
  pinned against the recipe generation declared in defaults
  spack.package_repo (spack-packages v2026.06.0, Package API v2.2,
  compatible with Spack v1.1.1); when the generation pin moves, re-pin
  this roster with it. netcdf-cxx4 has exactly one recipe version and
  rides the newest netcdf chain. The newest two netcdf-c versions carry
  no hdf5 upper bound, so each chain pairs newest-with-newest. hdf5 2.1.0
  is the literal newest; the recipes mark 1.14.6 preferred — if 2.1.0
  misbehaves on-system, the 1.14.6 chain stands alone. dakota carries two
  versions (heaviest build; 6.24.0 fetches a tarball while 6.23.0 uses
  git refs with submodules — watch the first fetch). No target
  optimization this pass: lanes build at the portable baseline.
