schema_version: 1
name: science-full
tier: canonical
description: |
  Full curated science library set, up to three versions per package:
  HDF5/NetCDF serial+MPI cross-products, FFTW, OpenBLAS, LAPACK, Boost,
  Gnuplot, TAU, Dakota, and Kokkos for GPU lanes.

kinds: [serial, mpi, gpu]

specs:
  serial:
    # serial = MPI-capable packages deliberately built without MPI
    - hdf5@1.14.6 ~mpi +fortran +cxx +hl
    - hdf5@1.14.5 ~mpi +fortran +cxx +hl
    - hdf5@1.14.4-3 ~mpi +fortran +cxx +hl
    - netcdf-c@4.9.3 ~mpi ^hdf5@1.14.6~mpi
    - netcdf-c@4.9.2 ~mpi ^hdf5@1.14.5~mpi
    - netcdf-c@4.9.0 ~mpi ^hdf5@1.14.4-3~mpi
    - netcdf-fortran@4.6.2 ^netcdf-c@4.9.3~mpi
    - netcdf-fortran@4.6.1 ^netcdf-c@4.9.2~mpi
    - netcdf-fortran@4.6.0 ^netcdf-c@4.9.0~mpi
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.9.3~mpi
    - fftw@3.3.10 ~mpi
    - fftw@3.3.9 ~mpi
    - fftw@3.3.8 ~mpi
    - boost@1.88.0 ~mpi
    - boost@1.87.0 ~mpi
    - boost@1.86.0 ~mpi
    # only-serial but compiler/performance-sensitive, so payload not core
    - openblas@0.3.30
    - openblas@0.3.29
    - openblas@0.3.28
    # reference LAPACK alongside openblas's — flagged for team review
    - netlib-lapack@3.12.1
    - netlib-lapack@3.12.0
    - netlib-lapack@3.11.0
    # only-serial user tool; placement flagged for team review (core vs serial)
    - gnuplot@6.0.0
    - gnuplot@5.4.10
    - gnuplot@5.4.3
  mpi:
    - hdf5@1.14.6 +mpi +fortran +cxx +hl
    - hdf5@1.14.5 +mpi +fortran +cxx +hl
    - hdf5@1.14.4-3 +mpi +fortran +cxx +hl
    - netcdf-c@4.9.3 +mpi +parallel-netcdf ^hdf5@1.14.6+mpi
    - netcdf-c@4.9.2 +mpi +parallel-netcdf ^hdf5@1.14.5+mpi
    - netcdf-c@4.9.0 +mpi +parallel-netcdf ^hdf5@1.14.4-3+mpi
    - netcdf-fortran@4.6.2 ^netcdf-c@4.9.3+mpi
    - netcdf-fortran@4.6.1 ^netcdf-c@4.9.2+mpi
    - netcdf-fortran@4.6.0 ^netcdf-c@4.9.0+mpi
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.9.3+mpi
    - fftw@3.3.10 +mpi
    - fftw@3.3.9 +mpi
    - fftw@3.3.8 +mpi
    - tau@2.35 +mpi
    - tau@2.34.1 +mpi
    - dakota@6.20.0 +mpi
    - dakota@6.19.0 +mpi
  gpu:
    # +gpu expands per lane: +rocm amdgpu_target=<arch> or +cuda cuda_arch=<n>
    - kokkos@4.7.01 +gpu
    - kokkos@4.7.00 +gpu

provenance_hints:
  cray-mpich: Platform-backed
  openmpi:    Site-external
  openssl:    Site-external

notes: |
  Roster from the 2026-07 usage list plus tau and kokkos. openmpi,
  cray-mpich, and openssl are system externals, never built. Versions are
  pinned against the recipe generation the deployed Spack uses — Spack
  v1.1.1 pins spack-packages releases/v2025.11 (== v2025.11.0); when the
  deployed Spack moves, re-pin against its recipe generation. netcdf-cxx4
  has exactly one recipe version; it rides the newest netcdf chain only.
  netcdf-c has no 4.9.1 recipe, so the third chain pairs 4.9.0 with
  hdf5 1.14.4-3. dakota carries two versions (heaviest build in the
  roster). No target optimization this pass: lanes build at the portable
  baseline.
