schema_version: 1
name: core-foundation
tier: canonical
description: |
  Core lane set: compiler-agnostic building blocks and only-serial user
  packages (the loadable layer), plus the pinned ambient foundation
  libraries the core lane carries directly.

kinds: [core]

specs:
  core:
    # foundation — ambient in the lane view; single-version via require: pins
    - zlib@1.3.1
    - xz@5.4.6
    - zstd@1.5.6
    # core tools — user-loadable, compiler-agnostic building blocks
    - cmake@4.3.3
    - cmake@4.2.3
    - cmake@4.1.5
    - ninja
    - pkgconf
    - git
    - python@3.14.5
    - python@3.13.13
    - python@3.12.13
    - py-numpy@2.4.6 ^python@3.14.5
    - py-numpy@2.4.6 ^python@3.13.13
    - py-numpy@2.4.6 ^python@3.12.13
    - miniforge3@26.1.1-3
    # only-serial by nature (no MPI implementation exists)
    - gsl@2.8
    - gsl@2.7.1
    - gsl@2.7
    - sqlite@3.53.1
    - sqlite@3.51.2
    - sqlite@3.50.4

notes: |
  Version policy: three versions where the recipe generation carries them,
  minimum the latest two; miniforge3 is single-version by nature. numpy is
  single-version because 2.4.6 is the newest non-deprecated recipe and its
  python range (3.11:3.14) covers all three python lines; older numpy
  patches are deprecated in the recipes. Versions pinned against the recipe
  generation declared in defaults spack.package_repo (spack-packages
  v2026.06.0, compatible with Spack v1.1.1 via Package API v2.2). When the
  generation pin moves, re-pin this roster with it. Core membership rule:
  only-serial by nature (gsl, sqlite) or a compiler-agnostic building block
  (python, miniforge, cmake).
