schema_version: 1
name: core-foundation
tier: canonical
description: |
  Core lane set: compiler-agnostic building blocks and only-serial user
  packages (the loadable layer), plus the pinned ambient foundation
  libraries the core lane carries directly.

kinds: [cpu]

specs:
  cpu:
    # foundation — ambient in the lane view; single-version via require: pins
    - zlib@1.3.1
    - xz@5.4.6
    - zstd@1.5.6
    # core tools — user-loadable, compiler-agnostic building blocks
    - cmake@4.1.2
    - cmake@4.1.1
    - ninja
    - pkgconf
    - git
    - python@3.14.0
    - python@3.13.8
    - py-numpy@2.3.4 ^python@3.14.0
    - py-numpy@2.3.3 ^python@3.13.8
    - miniforge3@25.3.0-3
    # only-serial by nature (no MPI implementation exists)
    - gsl@2.8
    - gsl@2.7.1

notes: |
  Core membership rule (2026-07-08): a package belongs in core when it is
  only-serial by nature (gsl — no MPI implementation exists) or a
  compiler-agnostic building block (python, miniforge, cmake). Versions from
  the cse-stack science-full set (two per package). openblas stays in the
  science-full cpu block because it is compiler/performance-sensitive, not
  compiler-agnostic; gnuplot placement (only-serial user tool) is flagged for
  team review and currently sits in science-full.
