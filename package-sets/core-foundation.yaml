schema_version: 1
name: core-foundation
tier: canonical
description: |
  Core lane set: compiler-agnostic building blocks and only-serial user
  packages (the loadable layer), plus the pinned ambient foundation
  libraries the core lane carries directly.

kinds: [core]

specs:
  core:
    # foundation — ambient in the lane view; single-version via require: pins
    - zlib@1.3.1
    - xz@5.4.6
    - zstd@1.5.6
    # core tools — user-loadable, compiler-agnostic building blocks
    - cmake@4.1.2
    - cmake@4.1.1
    - cmake@4.0.4
    - ninja
    - pkgconf
    - git
    - python@3.14.0
    - python@3.13.8
    - python@3.12.12
    - py-numpy@2.3.4 ^python@3.14.0
    - py-numpy@2.3.4 ^python@3.13.8
    - py-numpy@2.3.4 ^python@3.12.12
    - py-numpy@2.3.3 ^python@3.13.8
    - miniforge3@25.3.0-3
    # only-serial by nature (no MPI implementation exists)
    - gsl@2.8
    - gsl@2.7.1
    - gsl@2.7
    - sqlite@3.50.4
    - sqlite@3.50.2
    - sqlite@3.46.0

notes: |
  Version policy: three versions where the recipe generation carries them,
  minimum the latest two; miniforge3 is single-version by nature. Versions
  pinned against the recipe generation the deployed Spack uses —
  Spack v1.1.1 pins spack-packages releases/v2025.11 (== v2025.11.0).
  When the deployed Spack moves, re-pin this roster against its recipe
  generation; a missing version fails concretize loudly and is a one-line
  adjustment here. Core membership rule: only-serial by nature (gsl,
  sqlite) or a compiler-agnostic building block (python, miniforge, cmake).
