schema_version: 1
name: linux-science
profile_contract: { schema_version: 1 }
templates: { set: v6 }
spack: { version: ">=1.1.1,<1.3" }

# Generic Linux science stack: the system GCC and the system/site OpenMPI as
# externals, never built. The GPU build skips cleanly on systems without GPU
# nodes (for example the smoke container); on Raider it renders the CUDA lane.

builds:
  - name: core
    kind: core
    compilers: baseline
    target: baseline
    package_set: core-foundation

  - name: serial
    kind: serial
    compilers: baseline
    target: baseline
    package_set: science-full

  - name: mpi
    kind: mpi
    compilers: baseline
    target: baseline
    mpi: { provider: openmpi, source: auto }
    package_set: science-full

  - name: gpu
    kind: gpu
    compilers: baseline
    target: baseline
    mpi: { provider: openmpi, source: auto }
    gpu: { archs: all }
    package_set: science-full

externals:
  compilers: prefer_platform
  mpi: prefer_platform
  openssl: system
  curl: system
  fabric_userspace: prefer_platform

foundation_pins: { zlib: "1.3.1", xz: "5.4.6", zstd: "1.5.6" }
release: { save_lockfiles: true, save_manifest: true }
